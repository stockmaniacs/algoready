name = "algoready"
compatibility_date = "2024-11-24"
pages_build_output_dir = ".next"

[build]
command = "npm run build"

[env]
NEXT_PUBLIC_API_URL = "https://api.algoready.dev"
NEXT_PUBLIC_WS_URL = "wss://api.algoready.dev"

[env.production]
NEXT_PUBLIC_API_URL = "https://api.algoready.dev"
NEXT_PUBLIC_WS_URL = "wss://api.algoready.dev"